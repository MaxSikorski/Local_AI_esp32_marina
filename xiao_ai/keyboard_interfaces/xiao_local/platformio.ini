[platformio]
default_envs = local_xiao

[env:local_xiao]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_xiao_8mb.csv
monitor_speed = 115200
lib_deps = https://github.com/Seeed-Projects/SeeedStudio_TFT_eSPI.git#096f2fa3549475af17f5266f0200ea241e14151f
platform_packages = toolchain-xtensa-esp-elf@symlink://${sysenv.POCKETGPT_GCC16_PACKAGE}
build_src_filter = -<*> +<main.cpp>
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
    -std=gnu++2a
    -I.pio/libdeps/local_xiao/TFT_eSPI
    -ffile-prefix-map=${PROJECT_DIR}=.
    -fmacro-prefix-map=${PROJECT_DIR}=.
    -fno-builtin-memcpy
    -fno-builtin-memset
    -fno-builtin-bzero
    -fno-builtin-stpcpy
    -fno-builtin-strncpy
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -include User_Setups/Setup66_Seeed_XIAO_Round.h
extra_scripts = post:check_firmware_size.py
